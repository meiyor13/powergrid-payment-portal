<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerGrid - Pay Your Bill</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #0066cc 0%, #004399 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .logo-icon {
            font-size: 32px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 400;
            margin-top: 10px;
            opacity: 0.95;
        }

        .content {
            padding: 40px 30px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: #0066cc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        input {
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        input:focus {
            outline: none;
            border-color: #0066cc;
            background: white;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        input:hover {
            border-color: #bbb;
        }

        .input-icon {
            position: relative;
        }

        .card-number-display {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 35px;
        }

        button {
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0066cc 0%, #004399 100%);
            color: white;
            grid-column: 1 / -1;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 102, 204, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #666;
            border: 1px solid #ddd;
        }

        .btn-cancel:hover {
            background: #e8e8e8;
        }

        .error-message {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #0066cc;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 13px;
            color: #0044aa;
            line-height: 1.6;
        }

        .success-message {
            background: #c8e6c9;
            border: 1px solid #4caf50;
            color: #2e7d32;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .content {
                padding: 25px 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .header {
                padding: 30px 20px;
            }

            .logo-text {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <div class="logo-text">PowerGrid</div>
            </div>
            <h2>Pay Your Electric Bill</h2>
        </div>

        <div class="content">
            <div class="info-box">
                ℹ️ This is a test payment portal. No charges will be processed.
            </div>

            <form id="paymentForm">
                <!-- Account Information Section -->
                <div class="form-section">
                    <h3>Account Information</h3>
                    <div class="form-row full">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" name="name" required placeholder="John Doe">
                            <div class="error-message" id="nameError"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="accountNumber">Account Number</label>
                            <input type="text" id="accountNumber" name="accountNumber" required placeholder="PG-000123456">
                            <div class="error-message" id="accountError"></div>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" required placeholder="(555) 123-4567">
                            <div class="error-message" id="phoneError"></div>
                        </div>
                    </div>

                    <div class="form-row full">
                        <div class="form-group">
                            <label for="address">Service Address</label>
                            <input type="text" id="address" name="address" required placeholder="123 Main Street, Apt 4B, Anytown, ST 12345">
                            <div class="error-message" id="addressError"></div>
                        </div>
                    </div>
                </div>

                <!-- Payment Information Section -->
                <div class="form-section">
                    <h3>Payment Details</h3>
                    <div class="form-row full">
                        <div class="form-group">
                            <label for="cardNumber">Credit Card Number</label>
                            <input type="text" id="cardNumber" name="cardNumber" required placeholder="1234 5678 9012 3456" maxlength="19">
                            <div class="card-number-display" id="cardDisplay"></div>
                            <div class="error-message" id="cardError"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="expiry">Expiry Date</label>
                            <input type="text" id="expiry" name="expiry" required placeholder="MM/YY" maxlength="5">
                            <div class="error-message" id="expiryError"></div>
                        </div>
                        <div class="form-group">
                            <label for="cvv">CCV / CVV</label>
                            <input type="text" id="cvv" name="cvv" required placeholder="123" maxlength="4">
                            <div class="error-message" id="cvvError"></div>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-cancel" onclick="resetForm()">Clear Form</button>
                    <button type="submit" class="btn-submit">Process Payment</button>
                </div>

                <div class="success-message" id="successMessage">
                    ✓ Form submitted successfully!
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('paymentForm');
        const cardInput = document.getElementById('cardNumber');
        const cardDisplay = document.getElementById('cardDisplay');

        // Format card number display
        cardInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s/g, '');
            let maskedValue = '';

            for (let i = 0; i < value.length; i++) {
                if (i < value.length - 4) {
                    maskedValue += '●';
                } else {
                    maskedValue += value[i];
                }

                if ((i + 1) % 4 === 0 && i !== value.length - 1) {
                    maskedValue += ' ';
                }
            }

            if (value.length === 0) {
                cardDisplay.textContent = '';
            } else {
                cardDisplay.textContent = maskedValue;
            }
        });

        // Format card number with spaces
        cardInput.addEventListener('keyup', function(e) {
            let value = e.target.value.replace(/\s/g, '');
            let formattedValue = '';

            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 4 === 0) {
                    formattedValue += ' ';
                }
                formattedValue += value[i];
            }

            e.target.value = formattedValue;
        });

        // Format expiry date
        document.getElementById('expiry').addEventListener('keyup', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            e.target.value = value;
        });

        // CVV numbers only
        document.getElementById('cvv').addEventListener('keyup', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });

        // Form validation
        function validateForm() {
            let isValid = true;
            clearErrors();

            const name = document.getElementById('name').value.trim();
            if (!name) {
                showError('nameError', 'Please enter your full name');
                isValid = false;
            }

            const accountNumber = document.getElementById('accountNumber').value.trim();
            if (!accountNumber) {
                showError('accountError', 'Please enter your account number');
                isValid = false;
            }

            const phone = document.getElementById('phone').value.trim();
            if (!phone || phone.length < 10) {
                showError('phoneError', 'Please enter a valid phone number');
                isValid = false;
            }

            const address = document.getElementById('address').value.trim();
            if (!address) {
                showError('addressError', 'Please enter your service address');
                isValid = false;
            }

            const cardNumber = document.getElementById('cardNumber').value.replace(/\s/g, '');
            if (!cardNumber || cardNumber.length !== 16 || !/^\d+$/.test(cardNumber)) {
                showError('cardError', 'Please enter a valid 16-digit card number');
                isValid = false;
            }

            const expiry = document.getElementById('expiry').value.trim();
            if (!/^\d{2}\/\d{2}$/.test(expiry)) {
                showError('expiryError', 'Please use MM/YY format');
                isValid = false;
            }

            const cvv = document.getElementById('cvv').value.trim();
            if (!cvv || (cvv.length !== 3 && cvv.length !== 4)) {
                showError('cvvError', 'Please enter a valid CCV/CVV');
                isValid = false;
            }

            return isValid;
        }

        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
        }

        function clearErrors() {
            const errorElements = document.querySelectorAll('.error-message');
            errorElements.forEach(element => {
                element.style.display = 'none';
                element.textContent = '';
            });
        }

        function resetForm() {
            form.reset();
            cardDisplay.textContent = '';
            clearErrors();
            document.getElementById('successMessage').style.display = 'none';
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            if (validateForm()) {
                document.getElementById('successMessage').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('successMessage').style.display = 'none';
                }, 4000);
            }
        });
    </script>
</body>
</html>
